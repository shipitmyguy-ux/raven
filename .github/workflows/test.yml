name: Reusable core tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "raven-core.js"
      - "raven-api.js"
      - "app.js"
      - "tests/**"
      - "extension/**"
      - ".github/workflows/test.yml"
  push:
    branches: ["main", "refactor/reusable-core"]
    paths:
      - "raven-core.js"
      - "raven-api.js"
      - "app.js"
      - "tests/**"
      - "extension/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check raven-core.js
          node --check raven-api.js
          node --check app.js
          node --check extension/src/assistant-core.js
          node --check extension/src/content.js
          node --check extension/src/background.js
          node -e "JSON.parse(require('fs').readFileSync('extension/src/manifest.json','utf8'))"
      - name: Core regression tests
        run: |
          node tests/raven-core.test.mjs
          node tests/assistant-core.test.mjs
