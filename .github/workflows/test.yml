name: Reusable core tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "raven-core.js"
      - "document-revision.mjs"
      - "chatgpt-direct.mjs"
      - "oneclick-client.mjs"
      - "application-prepare.mjs"
      - "remote-writer-client.mjs"
      - "pair-writer*"
      - "supabase/functions/raven-local-queue/**"
      - "raven-api.js"
      - "app.js"
      - "index.html"
      - "studio-directory.html"
      - "supabase/functions/raven-studio-scan/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - "tests/**"
      - "scripts/**"
      - "docs/BACKUP_RESTORE.md"
      - "extension/**"
      - "supabase/functions/raven-backend-v3/**"
      - "supabase/functions/raven-generate-v1/**"
      - "supabase/functions/raven-generate-v2/**"
      - "supabase/functions/raven-cover-v2/**"
      - "supabase/functions/raven-mcp-v1/**"
      - "supabase/functions/_shared/**"
      - ".github/workflows/test.yml"
  push:
    branches: ["main", "refactor/reusable-core"]
    paths:
      - "raven-core.js"
      - "document-revision.mjs"
      - "chatgpt-direct.mjs"
      - "oneclick-client.mjs"
      - "application-prepare.mjs"
      - "remote-writer-client.mjs"
      - "pair-writer*"
      - "supabase/functions/raven-local-queue/**"
      - "raven-api.js"
      - "app.js"
      - "index.html"
      - "studio-directory.html"
      - "supabase/functions/raven-studio-scan/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - "tests/**"
      - "scripts/**"
      - "docs/BACKUP_RESTORE.md"
      - "extension/**"
      - "supabase/functions/raven-backend-v3/**"
      - "supabase/functions/raven-generate-v1/**"
      - "supabase/functions/raven-generate-v2/**"
      - "supabase/functions/raven-cover-v2/**"
      - "supabase/functions/raven-mcp-v1/**"
      - "supabase/functions/_shared/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install core test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check raven-core.js
          node --check raven-api.js
          node --check app.js
          node --check chatgpt-direct.mjs
          node --check application-prepare.mjs
          node --check scripts/application-pdf.mjs
          node --check extension/src/prepare-background.js
          node --check extension/src/prepare-content.js
          node --check oneclick-client.mjs
          node --check scripts/oneclick-codex.mjs
          node --check scripts/oneclick-server.mjs
          node --check scripts/oneclick-workflow.mjs
          node --check scripts/private-document-workflow.mjs
          node --check supabase/functions/_shared/mcp-bridge.mjs
          node --check supabase/functions/_shared/mcp-oauth.mjs
          node --check oauth-consent.mjs
          node --check scripts/private-mcp-stdio.mjs
          node scripts/build-mcp-renderer.mjs --check
          node --check extension/src/assistant-core.js
          node --check extension/src/content.js
          node --check extension/src/background.js
          node --check supabase/functions/raven-backend-v3/csv-records.mjs
          node --check scripts/raven-backup-lib.mjs
          node --check scripts/export-raven.mjs
          node --check scripts/verify-raven-backup.mjs
          node --check scripts/restore-raven.mjs
          node -e "JSON.parse(require('fs').readFileSync('extension/src/manifest.json','utf8'))"
      - name: Repository secret scan
        run: node scripts/check-secrets.mjs
      - name: Core regression tests
        run: |
          node --test tests/application-pdf.test.mjs tests/application-prepare.test.mjs tests/extension-prepare.test.mjs
          node --test tests/local-writer-queue.test.mjs
          node --test tests/oneclick-client.test.mjs tests/oneclick-workflow.test.mjs tests/oneclick-server.test.mjs tests/oneclick-security.test.mjs tests/oneclick-power.test.mjs
          node --test tests/private-mcp-stdio.test.mjs
          node --test tests/mcp-bridge.test.mjs tests/mcp-oauth.test.mjs tests/apply-resume.test.mjs
          node --test tests/chatgpt-direct.test.mjs tests/chatgpt-handoff.test.mjs tests/resume-transfer.test.mjs tests/chatgpt-extension.test.mjs
          node tests/document-final-review.test.mjs
          node tests/number-evidence-trace.test.mjs
          node tests/game-art-filter.test.mjs
          node tests/professional-sales-filter.test.mjs
          node tests/labor-location-filter.test.mjs
          node tests/studio-context.test.mjs
          node --test tests/listing-availability.test.mjs tests/listing-persistence.test.mjs
          node tests/raven-core.test.mjs
          node tests/job-dedup.test.mjs
          node --test tests/job-duplicate-evidence.test.mjs
          node --test tests/studio-sheet-feed.test.mjs
          node --test tests/studio-sheet-scan-handler.test.mjs
          node --test tests/studio-ingest-dedup.test.mjs
          node --test tests/studio-us-eligibility.test.mjs
          node --test tests/backend-game-ingestion.test.mjs
          node tests/assistant-core.test.mjs
          node tests/ats-csv.test.mjs
          node tests/drive-source.test.mjs
          node tests/tab-filter-architecture.test.mjs
          node tests/request-budget.test.mjs
          node tests/single-source.test.mjs
          node tests/search-resilience.test.mjs
          node tests/studio-directory.test.mjs
          node --test tests/studio-ingamejob.test.mjs
          node --test tests/studio-providers.test.mjs tests/studio-scan-handler.test.mjs tests/studio-detail.test.mjs tests/studio-icims.test.mjs tests/studio-avature.test.mjs tests/studio-jobylon.test.mjs tests/studio-result-window.test.mjs tests/studio-bilingual.test.mjs tests/studio-portal-dispatch.test.mjs tests/studio-to-resume.test.mjs tests/studio-indie-board.test.mjs tests/studio-schedule.test.mjs tests/studio-teamtailor.test.mjs tests/studio-directory-pagination.test.mjs tests/studio-breezy.test.mjs tests/studio-recruitee.test.mjs tests/studio-remote-game-jobs.test.mjs tests/studio-blenderartists.test.mjs tests/studio-epic-forum.test.mjs tests/studio-artstation.test.mjs tests/studio-hitmarker.test.mjs tests/studio-result-dedup.test.mjs tests/studio-eightbit.test.mjs tests/studio-skillsearch.test.mjs tests/studio-skillsearch-snapshot.test.mjs tests/studio-gamesjobsdirect.test.mjs
          node tests/final-closeout.test.mjs
          node tests/task-health-current.test.mjs
          node tests/generator-consolidation-v2.test.mjs
          node tests/resume-quality-v3.test.mjs
          node tests/document-writer.test.mjs
          node --test tests/document-profile.test.mjs
          node --test tests/professional-evidence-plan.test.mjs
          node tests/document-revision.test.mjs
          node tests/document-reliability.test.mjs
          node tests/cloudflare-free.test.mjs
          node tests/control-panel.test.mjs
          node tests/canonical-identity.test.mjs
          node tests/backup-contract.test.mjs

  safety-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Targeted browser regression tests
        run: |
          npx playwright test e2e/studio-directory.spec.mjs e2e/studio-job-flow.spec.mjs e2e/job-dedup.spec.mjs
          npx playwright test --grep "Apply on site|summary-only revision|listing and direct application remain available|generators save discovery jobs|application requires approval of both exact documents|review preserves approved document and revision invalidates approval|failed revision keeps the saved document and its approval|local master resume and track assignments persist through reload|offline resume fallback creates a local draft without network generation|generation cache prevents a duplicate resume model call|iPhone SE viewport keeps Raven usable without page overflow|refresh updates every job track and tabs are filter-only"

  private-tunnel-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protected tunnel credential and launcher tests
        shell: pwsh
        run: ./tests/private-tunnel-credentials.test.ps1
      - name: Windows PowerShell 5.1 protected credential compatibility
        shell: powershell
        run: ./tests/private-tunnel-credentials.test.ps1
