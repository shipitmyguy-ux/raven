name: Production Smoke Tests
on:
  workflow_dispatch:

jobs:
  smoke:
    name: Headless Production Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Production Smoke Suite
        run: npm run test:smoke

      - name: Upload Test HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Failure Artifacts (Screenshots & Traces)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-failure-artifacts
          path: test-results/
          retention-days: 14
