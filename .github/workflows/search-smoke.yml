name: Raven search smoke test

on:
  push:
    paths:
      - ".github/workflows/search-smoke.yml"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Bing RSS
        run: |
          curl --max-time 30 -sS 'https://www.bing.com/search?format=rss&count=20&q=%22project%20manager%22%20remote%20Colorado%20jobs%20site%3Alinkedin.com%2Fjobs%2Fview' | head -c 8000
