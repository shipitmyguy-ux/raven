name: Raven search smoke test

on:
  push:
    paths:
      - ".github/workflows/search-smoke.yml"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Search
        run: |
          KEY=$(sed -n 's/.*searchAnonKey: "\([^"]*\)".*/\1/p' config.js)
          URL=$(sed -n 's/.*searchApiUrl: "\([^"]*\)".*/\1/p' config.js)
          curl --max-time 150 -sS -X POST "$URL" \
            -H "Authorization: Bearer $KEY" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            --data '{"action":"search","track":"Professional"}'
