name: Raven search smoke test

on:
  push:
    paths:
      - ".github/workflows/search-smoke.yml"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect LinkedIn guest jobs
        run: |
          curl --max-time 30 -sS -L 'https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search?keywords=Project%20Manager&location=Colorado%2C%20United%20States&f_WT=2&start=0' \
            -H 'User-Agent: Mozilla/5.0' | head -c 12000
