<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Raven · JobTrack Pipeline</title>
  <script>
    window.RAVEN_ASSET_VERSION = Date.now().toString(36);
    document.write('<link rel="stylesheet" href="./styles.css?v=' + window.RAVEN_ASSET_VERSION + '">');
    document.write('<link rel="stylesheet" href="./theme.css?v=' + window.RAVEN_ASSET_VERSION + '">');
  </script>
</head>
<body>
  <header class="topbar">
    <h1>Raven</h1>
    <p id="syncStatus">Loading jobs...</p>
  </header>

  <main>

    <section class="track-tabs" id="jobs" role="tablist" aria-label="Job tracks">
      <button type="button" class="track-tab active" data-track="Games / 3D" role="tab" aria-selected="true">Games / 3D</button>
      <button type="button" class="track-tab" data-track="Professional" role="tab" aria-selected="false">Professional</button>
      <button type="button" class="track-tab" data-track="Labor" role="tab" aria-selected="false">Labor</button>
      <button type="button" class="track-tab" data-track="Wildcard" role="tab" aria-selected="false">Wildcard</button>
    </section>

    <section class="toolbar">
      <input id="searchBox" type="search" placeholder="Search jobs" data-feature="search">
      <select id="statusFilter" aria-label="Filter jobs" data-feature="status-filter" hidden><option value="">All statuses</option></select>
      <button id="searchJobsButton" type="button" data-feature="job-search-trigger">Pull new jobs</button>
      <button id="toggleCaptureButton" type="button" aria-expanded="false" aria-controls="captureForm">Add job</button>
      <form id="captureForm" class="url-capture" data-feature="capture-form" hidden>
        <input id="jobUrl" name="url" type="url" autocomplete="off" placeholder="Paste job URL" required>
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="pipeline-shell">
      <div class="pipeline-board" id="jobList" aria-live="polite"></div>
    </section>
    <ul id="queueList" hidden></ul>

    <dialog id="generatorDialog" class="generator-dialog">
      <form id="generatorForm" method="dialog">
        <header>
          <div>
            <h2 id="generatorTitle">Generate document</h2>
            <p id="generatorContext"></p>
          </div>
          <button id="generatorCancel" type="button" data-generator-cancel aria-label="Close" title="Close">×</button>
        </header>

        <label class="generator-field">
          <span>Tone</span>
          <select id="generatorTone">
            <option value="direct">Direct and professional</option>
            <option value="warm">Warm and conversational</option>
            <option value="technical">Technical and precise</option>
            <option value="leadership">Leadership focused</option>
          </select>
        </label>

        <label class="generator-field">
          <span>Length</span>
          <select id="generatorLength">
            <option value="one-page">One page</option>
            <option value="two-page">Up to two pages</option>
            <option value="concise">Concise</option>
            <option value="detailed">Detailed</option>
          </select>
        </label>

        <fieldset>
          <legend>Include and tailor</legend>
          <div id="generatorSections" class="generator-sections"></div>
        </fieldset>

        <label class="generator-field">
          <span>Customization instructions</span>
          <textarea id="generatorInstructions" rows="4" placeholder="Emphasize specific experience, preserve a section, adjust tone, or request another revision."></textarea>
        </label>

        <label class="truth-check">
          <input id="generatorTruth" type="checkbox" required checked>
          <span>Use only verified experience and qualifications. Do not invent claims.</span>
        </label>

        <footer>
          <button type="button" id="generatorCancelFooter" data-generator-cancel>Cancel</button>
          <button type="submit" id="generatorSubmit">Queue generation</button>
        </footer>
      </form>
    </dialog>

    <footer class="app-footer">
      <a href="./extension/raven-capture-extension.zip" id="extensionLink" data-feature="extension-download">Chrome extension</a>
    </footer>
  </main>

  <script src="./snapshot.js?v=20260918-0518"></script>
  <script src="./config.js?v=5"></script>
  <script src="./raven-api.js?v=5"></script>
  <script src="./app.js?v=18"></script>
</body>
</html>
