<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raven · JobTrack Pipeline</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
  <header class="topbar">
    <h1>Raven</h1>
    <p id="syncStatus">Loading jobs...</p>
  </header>

  <main>

    <section class="stats-grid" aria-label="Application pipeline summary">
      <article class="stat-card">
        <span>Applications sent</span>
        <strong id="statApplied">0</strong>
        <small>across all roles</small>
      </article>
      <article class="stat-card">
        <span>Interviews</span>
        <strong id="statInterviews">0</strong>
        <small>currently active</small>
      </article>
      <article class="stat-card accent-stat">
        <span>Best match</span>
        <strong><span id="statBestMatch">0</span><em>%</em></strong>
        <small>based on your profile</small>
      </article>
    </section>

    <section class="track-tabs" id="jobs" role="tablist" aria-label="Job tracks">
      <button type="button" class="track-tab active" data-track="Professional" role="tab" aria-selected="true">Professional</button>
      <button type="button" class="track-tab" data-track="Labor" role="tab" aria-selected="false">Labor</button>
      <button type="button" class="track-tab" data-track="Wildcard" role="tab" aria-selected="false">Wildcard</button>
      <button type="button" class="track-tab" data-track="Games / 3D" role="tab" aria-selected="false">Games / 3D</button>
    </section>

    <section class="toolbar">
      <input id="searchBox" type="search" placeholder="Search jobs" data-feature="search">
      <select id="statusFilter" hidden><option value="">All statuses</option></select>
      <button id="searchJobsButton" type="button" data-feature="job-search-trigger">Pull new jobs</button>
      <button id="toggleCaptureButton" type="button" aria-expanded="false" aria-controls="capture">+ Add job</button>
    </section>

    <section class="capture capture-compact" id="capture" data-feature="capture-form" hidden>
      <form id="captureForm">
        <input id="jobTitle" name="title" type="text" autocomplete="off" placeholder="Job title">
        <div class="capture-row">
          <input id="jobUrl" name="url" type="url" autocomplete="off" placeholder="Add job URL" required>
          <button type="submit">Add job</button>
        </div>
      </form>
    </section>

    <section class="pipeline-shell">
      <div class="pipeline-board" id="jobList" aria-live="polite"></div>
    </section>
    <ul id="queueList" hidden></ul>
    <footer class="app-footer">
      <a href="./extension/raven-capture-extension.zip" id="extensionLink" data-feature="extension-download">Chrome extension</a>
    </footer>
  </main>

  <script src="./snapshot.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
