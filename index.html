<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Raven · JobTrack Pipeline</title>
  <script>
    window.RAVEN_ASSET_VERSION = Date.now().toString(36);
    document.write('<link rel="stylesheet" href="./styles.css?v=' + window.RAVEN_ASSET_VERSION + '">');
    document.write('<link rel="stylesheet" href="./theme.css?v=' + window.RAVEN_ASSET_VERSION + '">');
  </script>
</head>
<body>
  <header class="topbar">
    <h1>Raven</h1>
    <div class="topbar-actions">
      <p id="syncStatus">Loading jobs...</p>
      <button id="optionsButton" class="options-button" type="button" aria-haspopup="dialog" aria-controls="optionsDialog" aria-label="Open options" title="Options">⚙</button>
    </div>
  </header>

  <main>

    <section class="track-tabs" id="jobs" role="tablist" aria-label="Job tracks">
      <button type="button" class="track-tab active" data-track="Games / 3D" role="tab" aria-selected="true">Games / 3D</button>
      <button type="button" class="track-tab" data-track="Professional" role="tab" aria-selected="false">Professional</button>
      <button type="button" class="track-tab" data-track="Labor" role="tab" aria-selected="false">Labor</button>
      <button type="button" class="track-tab" data-track="Wildcard" role="tab" aria-selected="false">Wildcard</button>
    </section>

    <section class="toolbar">
      <input id="searchBox" type="search" placeholder="Search jobs" data-feature="search">
      <select id="statusFilter" aria-label="Filter jobs" data-feature="status-filter" hidden><option value="">All statuses</option></select>
      <button id="searchJobsButton" type="button" data-feature="job-search-trigger">Pull new jobs</button>
      <button id="toggleCaptureButton" type="button" aria-expanded="false" aria-controls="captureForm">Add job</button>
      <form id="captureForm" class="url-capture" data-feature="capture-form" hidden>
        <input id="jobUrl" name="url" type="url" autocomplete="off" placeholder="Paste job URL" required>
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="pipeline-shell">
      <div class="pipeline-board" id="jobList" aria-live="polite"></div>
    </section>
    <ul id="queueList" hidden></ul>

    <dialog id="optionsDialog" class="options-dialog">
      <form method="dialog">
        <header class="options-dialog-header">
          <h2>Options</h2>
          <button type="submit" class="options-close" aria-label="Close options" title="Close">×</button>
        </header>

        <div class="options-viewport">
          <section id="optionsHome" class="options-screen options-home" aria-label="Option categories">
            <button type="button" class="options-category" data-options-target="master-resumes">
              <span>Master resumes</span><span aria-hidden="true">›</span>
            </button>
            <button type="button" class="options-category" data-options-target="layout">
              <span>Layout</span><span aria-hidden="true">›</span>
            </button>
            <button type="button" class="options-category" data-options-target="job-info">
              <span>Job information</span><span aria-hidden="true">›</span>
            </button>
            <button type="button" class="options-category" data-options-target="behavior">
              <span>Behavior</span><span aria-hidden="true">›</span>
            </button>
            <button id="resetOptionsButton" class="options-reset" type="button">Reset to defaults</button>
          </section>

          <section id="optionsCard" class="options-screen options-card" aria-live="polite" hidden>
            <header class="options-card-header">
              <button id="optionsBackButton" class="options-back" type="button" aria-label="Back to option categories" title="Back">←</button>
              <h3 id="optionsCardTitle">Options</h3>
            </header>

            <div class="options-card-panel master-resumes-panel" data-options-panel="master-resumes" hidden>
              <p class="options-help">Add one or more source resumes, then assign each to the tracks it should drive.</p>
              <div id="masterResumeList" class="master-resume-list"></div>
              <button id="addMasterResumeButton" class="master-resume-add" type="button">+ Add master resume</button>

              <section id="masterResumeEditor" class="master-resume-editor" hidden>
                <label class="master-resume-field">
                  <span>Name</span>
                  <input id="masterResumeName" type="text" placeholder="e.g. 3D master">
                </label>

                <label class="master-resume-field">
                  <span>Source</span>
                  <select id="masterResumeSource">
                    <option value="drive">Google Drive</option>
                    <option value="local">Local file</option>
                  </select>
                </label>

                <label id="masterResumeDriveRow" class="master-resume-field">
                  <span>Google Drive URL</span>
                  <input id="masterResumeDriveUrl" type="url" placeholder="https://drive.google.com/...">
                </label>

                <label id="masterResumeLocalRow" class="master-resume-field" hidden>
                  <span>Local file</span>
                  <input id="masterResumeFile" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
                  <small id="masterResumeLocalStatus">Stored on this device.</small>
                </label>

                <fieldset class="master-resume-tracks">
                  <legend>Use for</legend>
                  <label><input type="checkbox" value="Games / 3D"> Games / 3D</label>
                  <label><input type="checkbox" value="Professional"> Professional</label>
                  <label><input type="checkbox" value="Labor"> Labor</label>
                  <label><input type="checkbox" value="Wildcard"> Wildcard</label>
                </fieldset>

                <div class="master-resume-actions">
                  <button id="saveMasterResumeButton" type="button">Save</button>
                  <button id="cancelMasterResumeButton" type="button">Cancel</button>
                </div>
              </section>
            </div>

            <div class="options-card-panel" data-options-panel="layout" hidden>
              <label class="option-row">
                <span>Card density</span>
                <select data-setting-key="card-density">
                  <option value="compact">Compact</option>
                  <option value="comfortable">Comfortable</option>
                </select>
              </label>
              <label class="option-row">
                <span>Sidebar width</span>
                <select data-setting-key="sidebar-width">
                  <option value="300px">Narrow</option>
                  <option value="360px">Default</option>
                  <option value="420px">Wide</option>
                </select>
              </label>
              <label class="option-row">
                <span>Detail width</span>
                <select data-setting-key="detail-panel-width">
                  <option value="0.8fr">Narrow</option>
                  <option value="1fr">Default</option>
                  <option value="1.25fr">Wide</option>
                </select>
              </label>
            </div>

            <div class="options-card-panel" data-options-panel="job-info" hidden>
              <label class="option-toggle"><input type="checkbox" data-setting-key="show-salary"><span>Show salary</span></label>
              <label class="option-toggle"><input type="checkbox" data-setting-key="show-remote"><span>Show remote status</span></label>
              <label class="option-toggle"><input type="checkbox" data-setting-key="show-source"><span>Show source</span></label>
              <label class="option-toggle"><input type="checkbox" data-setting-key="show-notes"><span>Show notes</span></label>
              <label class="option-toggle"><input type="checkbox" data-setting-key="show-sync-status"><span>Show sync status</span></label>
            </div>

            <div class="options-card-panel" data-options-panel="behavior" hidden>
              <label class="option-row">
                <span>Default sort</span>
                <select data-setting-key="default-sort">
                  <option value="added-desc">Newest first</option>
                  <option value="added-asc">Oldest first</option>
                  <option value="title-asc">Title A–Z</option>
                  <option value="company-asc">Company A–Z</option>
                </select>
              </label>
            </div>
          </section>
        </div>
      </form>
    </dialog>

    <dialog id="documentReviewDialog" class="document-review-dialog">
      <form id="documentReviewForm" method="dialog">
        <header><div><h2 id="reviewTitle">Review document</h2><p id="reviewContext"></p></div><button type="button" data-review-close aria-label="Close and save" title="Close and save">×</button></header>
        <div class="document-preview"><iframe id="reviewFrame" title="Generated document preview"></iframe><a id="reviewOpenFile" href="#" target="_blank" rel="noopener">Open file in a new tab</a></div>
        <label class="review-prompt"><span>Ask AI for a change</span><textarea id="reviewInstructions" rows="3" placeholder="Optional: Make the summary shorter, emphasize specific experience, or adjust the tone."></textarea></label>
        <footer><button type="button" data-review-close>Close and save</button><button type="submit" id="reviewSubmit">Apply requested changes</button></footer>
      </form>
    </dialog>

    <footer class="app-footer">
      <a href="./extension/raven-capture-extension.zip" id="extensionLink" data-feature="extension-download">Chrome extension</a>
    </footer>
  </main>

  <script src="./snapshot.js?v=20260918-0518"></script>
  <script src="./config.js?v=5"></script>
  <script src="./raven-api.js?v=5"></script>
  <script src="./app.js?v=26"></script>
</body>
</html>
